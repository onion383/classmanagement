<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/vite.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="http://localhost:3000">
    <!-- 注意：这里不要手写 <link rel="modulepreload" href="/src/main.js">。
         构建时它会被解析成一个独立 chunk（与真正入口 chunk 不同名），
         导致启动多下载一个无人使用的小 chunk；入口及其静态依赖的 modulepreload
         由 Vite 构建时自动注入（见构建产物的 index.html），无需手写。 -->
    
    <title>班级管理系统</title>
    <style>
      /* 首屏载入占位：避免窗口已出但白屏。Vue mount 时会自动替换 #app 内的这段内容。 */
      html, body { margin: 0; height: 100%; }
      body { background: linear-gradient(160deg, #eef2ff 0%, #e2e8ff 100%); }
      /* 占位自身带不透明背景，成为独立自洽的图层：不依赖 body 底色，
         移除时不会与下方正在绘制的页面出现半透明层叠。 */
      .app-splash {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 18px; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        background: linear-gradient(160deg, #eef2ff 0%, #e2e8ff 100%);
      }
      .app-splash .ring .spin { animation: rotate 1.4s linear infinite; transform-origin: center; }
      /* 失败态：转圈换成蓝色感叹号三角，与运行期异常页保持一致 */
      .app-splash .warn-icon { display: none; }
      .app-splash.is-failed .ring { display: none; }
      .app-splash.is-failed .warn-icon { display: block; }
      .app-splash .logo { font-size: 22px; font-weight: 600; color: #1e40af; letter-spacing: 1px; }
      .app-splash .tip { font-size: 13px; color: #6b7280; }
      /* 启动失败兜底：后端一直起不来时，占位页给出文案与「重启后端 / 退出应用」 */
      .app-splash .fail-box { display: flex; flex-direction: column; align-items: center; gap: 12px; }
      .app-splash .fail-msg { font-size: 13px; color: #b91c1c; }
      .app-splash .fail-row { display: flex; gap: 10px; }
      .app-splash .fail-btn {
        font-size: 13px; padding: 6px 16px; border-radius: 6px; cursor: pointer;
        border: 1px solid rgba(30, 64, 175, .35); background: #fff; color: #1e40af;
      }
      .app-splash .fail-btn.primary { background: #1e40af; border-color: #1e40af; color: #fff; }
      .app-splash .fail-btn:disabled { opacity: .5; cursor: default; }
      @keyframes rotate { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-splash">
        <svg class="ring" width="34" height="34" viewBox="0 0 22 22">
          <circle cx="11" cy="11" r="8" fill="none" stroke="rgba(30,64,175,.25)" stroke-width="3"/>
          <circle class="spin" cx="11" cy="11" r="8" fill="none" stroke="#1e40af" stroke-width="3"
                  stroke-dasharray="42" stroke-dashoffset="12" stroke-linecap="round"/>
        </svg>
        <svg class="warn-icon" width="36" height="36" viewBox="0 0 24 24" fill="none"
             stroke="#1e40af" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        <span class="logo">班级管理系统</span>
        <span class="tip">加载中，请稍候…</span>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
