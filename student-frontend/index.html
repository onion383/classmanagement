<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="http://localhost:3000">
    <!-- 注意：这里不要手写 <link rel="modulepreload" href="/src/main.js">。
         构建时它会被解析成一个独立 chunk（与真正入口 chunk 不同名），
         导致启动多下载一个无人使用的小 chunk；入口及其静态依赖的 modulepreload
         由 Vite 构建时自动注入（见构建产物的 index.html），无需手写。 -->
    
    <title>班集</title>
    <!--splash-css-->
    <style>
      /* 首屏占位的基础兜底：占位自身带不透明渐变底（见 splash/splash.css），
         这里给 body 一层同色兜底，窗口出现的瞬间即无白屏。 */
      html, body { margin: 0; height: 100%; }
      body { background: linear-gradient(160deg, #eef2ff 0%, #e2e8ff 100%); }
    </style>
  </head>
  <body>
    <div id="app">
      <!--splash-html-->
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
