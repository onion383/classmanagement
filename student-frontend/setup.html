<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>首次安装引导</title>
  <!--splash-css-->
  <style>
    * { user-select: none; -webkit-user-select: none; }
    /* 与主窗口同构：不强制屏蔽主题背景图，让毛玻璃主题的全局背景（--bg-image + 遮罩）正常绘制，
       卡片以半透明毛玻璃浮在其上。此处仅设透明兜底，优先级低于主题规则，不会覆盖背景图。 */
    html, body { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; background: transparent; }
    /* 挂载根节点必须撑满：否则 .setup-wrap 的 height:100% 失去参照退化为内容高度，
       卡片下方会露出窗口背景。这里定死满高，卡片随之铺满整窗。 */
    #setup-app { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="setup-app">
    <!--splash-html-->
  </div>
  <script type="module" src="/src/subwindows/setup/main.js"></script>
  <script>
    // 灰色副标题显示「程序正在干嘛」：订阅主进程的 boot-status，并主动查一次当前值，
    // 兜住「页面先加载、状态后更新」的竞态。挂载后由 Vue 界面接管，此脚本自然失效。
    (function () {
      var el = document.getElementById('boot-tip')
      if (!el) return
      var api = window.electron
      if (api && api.on) {
        api.on('from-main', function (m) {
          if (m && m.type === 'boot-status' && m.text) el.textContent = m.text
        })
      }
      if (api && api.invoke) {
        api.invoke('boot-status').then(function (t) { if (t) el.textContent = t }).catch(function () {})
      }
    })()
  </script>
</body>
</html>
